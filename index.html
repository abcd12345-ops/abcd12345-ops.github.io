<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salon"><meta name="theme-color" content="#1f4e5f">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理发店记录系统</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2733;--mute:#6b7683;--line:#dfdbd2;--acc:#1f4e5f;--acc2:#b8332e;--ok:#2d7a4f}
@media(prefers-color-scheme:dark){:root{--bg:#161b20;--card:#1f262d;--ink:#e8ebee;--mute:#95a0ab;--line:#33404a;--acc:#5fb0c9;--acc2:#e0655f;--ok:#6cc596}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
html{-webkit-text-size-adjust:100%}button,select,input{touch-action:manipulation}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--acc2) 0 14px,#fff 14px 28px,var(--acc) 28px 42px)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
button,.btn{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{color:var(--acc2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:42px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:20px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.bar>div{min-width:160px}
.empty{padding:24px;text-align:center;color:var(--mute)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{width:100%;max-width:360px}
.err{color:var(--acc2);min-height:22px;font-size:14px}
.shop{font-size:22px;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;min-height:0;width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;font-size:13px;color:var(--mute)}
.cd{min-height:88px;border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;overflow:hidden;background:var(--bg)}
.cd.off{border:0;background:none;cursor:default}
.cd.today b{color:var(--acc2)}
.cd.sel{outline:2px solid var(--acc);background:var(--card)}
.cd b{font-size:13px}
.ap{font-size:11px;line-height:1.3;padding:1px 4px;margin-top:2px;border-radius:4px;background:var(--acc);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.done{background:var(--ok)}
.more{font-size:11px;color:var(--mute);margin-top:2px}
.ag{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ag .tm{font-size:20px;font-weight:700;min-width:64px}
.ag .inf{flex:1;min-width:180px}
.ag.cancelled .inf,.ag.cancelled .tm{opacity:.5;text-decoration:line-through}
.ag .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc);color:#fff;margin-left:6px}
.tag.done{background:var(--ok)}.tag.cancelled{background:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;align-items:center;justify-content:center;padding:20px}
.ov .card{width:100%;max-width:360px;margin:0}
.rhead{display:block;text-align:center}
.shopinfo{display:block;width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;text-align:center;font-size:14px;min-height:0;padding:3px 0;margin-bottom:2px;border-radius:0}
#receipt{display:none}
.rc{max-width:80mm;margin:0 auto;font-size:13px;color:#000;line-height:1.6}
.printonly{display:none}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;color:#000;font-size:12px}
 .noprint,.stripe,#lock{display:none!important}
 .card{border:0;padding:0;margin:0 0 8px}
 .printonly{display:block}
 .shop{border:0;font-size:22px;color:#000;text-align:center}
 .shopinfo{border:0;color:#000}.shopinfo::placeholder{color:transparent}
 body.pr-receipt #app{display:none!important}body.pr-receipt #receipt{display:block}
 .rhead{display:block;text-align:center}
 table{font-size:11.5px}th,td{border-bottom:1px solid #999;color:#000}
 .stat{border:1px solid #666}
 tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="lock"><div class="card">
  <select id="langSel2" aria-label="语言" style="margin-bottom:10px"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select>
  <h2 id="lockTitle">输入密码</h2>
  <p id="lockHint" style="color:var(--mute);margin-top:0"></p>
  <input type="password" id="pw1" placeholder="密码" autocomplete="off">
  <input type="password" id="pw2" placeholder="再次输入密码" style="display:none;margin-top:8px" autocomplete="off">
  <div class="err" id="lockErr"></div>
  <button class="p" id="lockBtn" style="width:100%">进入</button>
</div></div>

<div class="stripe noprint"></div>
<div class="wrap" id="app" style="display:none">
<header class="top noprint">
  <h1>理发店预约与收支记录</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <select id="langSel" aria-label="语言" style="width:auto"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select>
    <button id="chgPw">修改密码</button>
    <button id="lockOut" class="d">锁定退出</button>
  </div>
</header>
<div id="bkBar" class="noprint" style="display:none;border:1px solid var(--acc2);color:var(--acc2);border-radius:10px;padding:10px 14px;margin-bottom:14px;background:var(--card)"></div>

<section class="card noprint">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <button id="calPrev" aria-label="上个月">‹</button><h2 id="calTitle" style="margin:0;flex:1;text-align:center"></h2><button id="calNext" aria-label="下个月">›</button><button id="calToday">今天</button>
  </div>
  <div class="cal" id="cal"></div>
  <h2 id="agTitle" style="margin-top:16px"></h2>
  <div id="agenda"></div>
</section>

<section class="card noprint" id="formCard">
  <h2 id="formTitle">新增预约</h2>
  <div class="grid">
    <div><label>顾客姓名 *</label><input id="fName" list="custList" autocomplete="off"></div>
    <datalist id="custList"></datalist>
    <div><label>电话（选填）</label><input id="fPhone" type="tel"></div>
    <div><label>预约日期</label><input id="fDate" type="date"></div>
    <div><label>预约时间</label><input id="fTime" type="time"></div>
    <div class="full"><label>服务项目（可多选）</label>
      <div class="chips" id="svcChips"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="svcOther" placeholder="手动补充项目" style="max-width:220px"><input id="svcPrice" type="number" step="0.01" min="0" inputmode="decimal" placeholder="价格 RM" style="max-width:120px"><button id="svcAdd">添加</button><button id="svEdit">编辑价目表</button></div>
      <div id="svcTotal" style="margin-top:6px;font-weight:600"></div>
    </div>
    <div class="full">
      <button type="button" id="pdToggle" aria-expanded="false" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left"><span><b>理发产品</b> <span id="pdSummary"></span></span><span id="pdArrow">▼ 展开</span></button>
      <div id="pdBody" style="display:none;margin-top:8px"><div id="pdList"></div>
        <button type="button" id="pdEdit" style="margin-top:10px">编辑产品与库存</button></div>
    </div>
    <div class="full"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="fDone" style="width:auto;min-height:0"> 已消费，直接结账（生成单据号）</label></div>
    <div id="fAmtBox" style="display:none"><label>消费金额 (RM)</label><input id="fAmount" type="number" step="0.01" min="0" inputmode="decimal"></div>
    <div id="fPayBox" style="display:none"><label>支付方式</label>
      <select id="fPay"><option>Cash</option><option>QR Pay</option><option>Card</option><option>Transfer</option></select></div>
    <div class="full"><label>备注</label><textarea id="fNotes" rows="2"></textarea></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px">
    <button class="p" id="saveBtn">保存记录</button>
    <button id="cancelEdit" style="display:none">取消编辑</button>
  </div>
</section>

<section class="card noprint">
  <div class="bar">
    <div><label>月份</label><input type="month" id="monthSel"></div>
    <div><label>按日查看</label><input type="date" id="daySel"></div>
    <button id="dayBtn">按日查看</button>
    <button id="allBtn">查看全部</button>
    <button class="p" id="pdfBtn">导出当前月份报税 PDF</button>
    <button id="exportBtn">导出备份 (JSON)</button>
    <button id="importBtn">导入恢复</button>
    <button id="copyBtn">复制备份文本</button>
    <button id="pasteBtn">粘贴恢复</button>
    <input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" style="display:none">
  </div>
</section>

<section class="card noprint">
  <h2>数据安全</h2>
  <p id="safeInfo" style="margin:0 0 4px"></p>
  <p id="safePersist" style="margin:0 0 10px;color:var(--mute);font-size:14px"></p>
  <div class="bar"><div><label>自动快照</label><select id="snapSel"></select></div><button id="snapRestore">恢复此快照</button></div>
</section>

<section class="card">
  <div class="rhead">
    <input class="shop" id="shopName" value="我的理发店" aria-label="店铺名称" style="text-align:center">
    <input class="shopinfo" id="shopAddr" placeholder="店铺地址（点这里填写）" aria-label="店铺地址">
    <input class="shopinfo" id="shopPhone" placeholder="店铺电话（点这里填写）" aria-label="店铺电话">
    <div id="rTitle" style="font-size:16px;margin:4px 0 10px"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div style="overflow-x:auto;margin-top:12px">
  <table>
    <thead><tr><th>单据号</th><th>日期</th><th>时间</th><th>顾客</th><th>电话</th><th>服务</th><th>支付</th><th class="r">金额 (RM)</th><th>备注</th><th class="noprint"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="printonly" style="margin-top:10px;font-size:11px">打印日期：<span id="pDate"></span></div>
</section>

<section class="card noprint" id="custCard">
  <button id="custToggle" aria-expanded="false" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left"><span><b>顾客资料</b> <span id="custCount"></span></span><span id="custArrow">▼ 展开</span></button>
  <div id="custBody" style="display:none;margin-top:12px">
  <div class="bar" style="margin-bottom:8px">
    <div style="flex:1"><label>查找</label><input id="custQ" type="search" placeholder="按姓名或电话查找"></div>
    <button class="p" id="custAdd">新增顾客</button>
    <button id="custImport">导入顾客 (CSV/VCF)</button><input type="file" id="custFile" accept=".csv,.txt,.vcf,text/csv,text/vcard" style="display:none">
  </div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>姓名</th><th>电话</th><th>到店次数</th><th class="r">消费总额 (RM)</th><th>最近到店</th><th>备注</th><th></th></tr></thead>
    <tbody id="custRows"></tbody>
  </table></div>
</div>
</section>
</div>

<div class="ov noprint" id="svBox" style="display:none"><div class="card" style="max-width:520px;max-height:85vh;overflow:auto">
  <h2>服务项目与价格</h2><div id="svRows"></div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="svAdd">添加项目</button><button class="p" id="svOk">保存</button><button id="svNo">取消</button></div>
</div></div>
<div class="ov noprint" id="pdBox" style="display:none"><div class="card" style="max-width:560px;max-height:85vh;overflow:auto">
  <h2>产品与库存</h2><p style="margin-top:0;color:var(--mute);font-size:14px">产品名称 / 价格 RM / 库存</p><div id="pdRows"></div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="pdAdd">添加产品</button><button class="p" id="pdOk">保存</button><button id="pdNo">取消</button></div>
</div></div>
<div id="receipt"></div>
<div class="ov noprint" id="pasteBox" style="display:none"><div class="card" style="max-width:520px">
  <h2>粘贴恢复</h2><p style="margin-top:0;color:var(--mute)">请把备份文本粘贴到这里</p>
  <textarea id="pasteTxt" rows="8" style="font-size:13px"></textarea>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="p" id="pasteOk">恢复</button><button id="pasteNo">取消</button></div>
</div></div>
<div class="ov noprint" id="cuEdit" style="display:none"><div class="card">
  <h2 id="cuTitle">新增顾客</h2>
  <label>姓名 *</label><input id="cuName">
  <label style="margin-top:8px">电话</label><input id="cuPhone" type="tel">
  <label style="margin-top:8px">备注（如发型偏好）</label><textarea id="cuNotes" rows="2"></textarea>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="p" id="cuOk">保存</button><button id="cuNo">取消</button></div>
</div></div>
<div class="ov noprint" id="cuHist" style="display:none"><div class="card" style="max-width:640px;max-height:85vh;overflow:auto">
  <h2 id="hsTitle"></h2><p id="hsSum" style="margin-top:0;color:var(--mute)"></p>
  <div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>服务</th><th>状态</th><th class="r">金额</th><th>单据号</th></tr></thead><tbody id="hsRows"></tbody></table></div>
  <button id="hsClose" style="margin-top:12px">关闭</button>
</div></div>
<div class="ov noprint" id="coBox" style="display:none"><div class="card">
  <h2>结账</h2><p id="coInfo" style="margin-top:0;color:var(--mute)"></p>
  <label>实际消费金额 (RM)</label><input id="coAmt" type="number" step="0.01" min="0" inputmode="decimal">
  <label style="margin-top:8px">支付方式</label>
  <select id="coPay"><option>Cash</option><option>QR Pay</option><option>Card</option><option>Transfer</option></select>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="p" id="coOk">确认结账</button><button id="coNo">取消</button></div>
</div></div>

const DICT={}; TR.forEach(([z,e,m])=>{DICT[z]=[e,m]});
function t(k,...a){let s=(lang==='zh'||!DICT[k])?k:DICT[k][lang==='en'?0:1];a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)});return s;}
const WD={zh:['日','一','二','三','四','五','六'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ms:['Ahd','Isn','Sel','Rab','Kha','Jum','Sab']};
const svcText=a=>a.map(x=>t(x)).join(lang==='zh'?'、':', ');
function monthTitle(y,m){if(lang==='zh')return y+'年'+m+'月';return new Date(y,m-1,1).toLocaleDateString(lang==='ms'?'ms-MY':'en-GB',{month:'long',year:'numeric'});}
function trDom(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];let n;
  while(n=w.nextNode()){if(!n.parentNode.closest('script,style'))ns.push(n);}
  ns.forEach(n=>{const o=n._o!==undefined?n._o:n.nodeValue,k=o.trim();
    if(!k||(n._o===undefined&&!(k in DICT)))return; n._o=o; n.nodeValue=o.replace(k,t(k));});
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{['placeholder','aria-label','title'].forEach(a=>{
    if(!el.hasAttribute(a))return; el._a=el._a||{}; if(el._a[a]===undefined)el._a[a]=el.getAttribute(a);
    const o=el._a[a]; if(o in DICT)el.setAttribute(a,t(o));});});
}

/* ---------- 数据：读取时补全默认值，永不清空 ---------- */
function normalize(r){
  r=(r&&typeof r==='object')?r:{};
  return {
    id:r.id||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
    date:r.date||'', time:r.time||'',
    customerName:r.customerName||'', phone:r.phone||'',
    services:Array.isArray(r.services)?r.services:(r.services?String(r.services).split(/[,，、]/).map(s=>s.trim()).filter(Boolean):[]),
    amount:Number(r.amount)||0,
    paymentMethod:r.paymentMethod||'Cash', notes:r.notes||'', status:r.status||'done', receiptNo:r.receiptNo||'', products:Array.isArray(r.products)?r.products.filter(x=>x&&x.name).map(x=>({name:String(x.name),qty:Number(x.qty)||0,price:Number(x.price)||0})):[],
    ...Object.fromEntries(Object.entries(r).filter(([k])=>!['id','date','time','customerName','phone','services','amount','paymentMethod','notes','status','receiptNo','products'].includes(k)))
  };
}
function load(){
  try{const raw=localStorage.getItem(DK); if(!raw) return [];
    const j=JSON.parse(raw); const arr=Array.isArray(j)?j:(j&&Array.isArray(j.records)?j.records:[]);
    return arr.map(normalize);
  }catch(e){ console.error(e); alert(t('读取数据出错，已保留原始数据未做改动。请先导出备份。')); throw e; }
}
const SNAP='hair_salon_snapshots_v1', LB='hair_salon_lastbackup_v1';
let persisted=null;
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAP)||'[]')}catch(e){return []}}
function save(){
  try{
    const prev=localStorage.getItem(DK);
    if(prev&&prev!=='[]'){try{const sn=getSnaps();
      if(!sn.some(x=>x.auto&&x.ts.slice(0,10)===new Date().toISOString().slice(0,10))){
        sn.push({ts:new Date().toISOString(),auto:true,records:JSON.parse(prev),customers});

  }catch(e){alert(t('保存失败：浏览器存储空间不足或被禁用。请立刻导出备份。'));}
}

}

/* ---------- 密码 ---------- */
async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('salon::'+s));
    return 'h1:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;for(const c of 'salon::'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'h0:'+h;}
}
let lockMode='login';
function showLock(mode){
  lockMode=mode; $('lock').style.display='flex'; $('app').style.display='none';
  $('pw1').value=$('pw2').value=''; $('lockErr').textContent='';
  $('pw2').style.display=mode==='login'?'none':'block';
  $('lockTitle').textContent=mode==='login'?t('输入密码'):(mode==='setup'?t('首次使用：设置管理员密码'):t('设置新密码'));
  $('lockHint').textContent=mode==='login'?'':t('请设置至少 4 位的密码，之后每次打开都需要输入。');
  $('lockBtn').textContent=mode==='login'?t('进入'):t('保存密码');
  setTimeout(()=>$('pw1').focus(),50);
}
async function submitLock(){
  const a=$('pw1').value;
  if(lockMode==='login'){
    if(await hash(a)===localStorage.getItem(PK)) enter(); else $('lockErr').textContent=t('密码不正确');
  }else{
    if(a.length<4){$('lockErr').textContent=t('密码至少 4 位');return;}
    if(a!==$('pw2').value){$('lockErr').textContent=t('两次输入不一致');return;}
    localStorage.setItem(PK,await hash(a)); enter();
  }
}
function enter(){ $('lock').style.display='none'; $('app').style.display='block'; render();

function normCust(c){c=(c&&typeof c==='object')?c:{};
  return {...c,id:c.id||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:c.name||'',phone:c.phone||'',notes:c.notes||'',createdAt:c.createdAt||today()};}
function saveCust(){localStorage.setItem(CUK,JSON.stringify(customers));}
function loadCustomers(){
  let raw=localStorage.getItem(CUK);
  if(raw===null){customers=[];records.forEach(r=>ensureCust(r.customerName,r.phone));saveCust();return;}
  try{const j=JSON.parse(raw);customers=Array.isArray(j)?j.map(normCust):[];}catch(e){customers=[];alert(t('顾客资料读取出错，请用备份恢复。'));}
}
function matches(c,r){const pc=digits(c.phone),pr=digits(r.phone);
  if(pc&&pr)return pc===pr;
  return c.name.trim().toLowerCase()===String(r.customerName||'').trim().toLowerCase();}
function ensureCust(name,phone){
  name=String(name||'').trim(); if(!name)return;
  const c=customers.find(x=>matches(x,{customerName:name,phone}));
  if(c){if(!c.phone&&phone)c.phone=phone;}
  else customers.push(normCust({name,phone}));
}
function custStats(c){const d=records.filter(r=>r.status==='done'&&matches(c,r));
  return {n:d.length,total:d.reduce((s,r)=>s+r.amount,0),last:[c.lastVisit||'',...d.map(r=>r.date)].sort().pop()||''};}
let custOpen=false;
function setCustOpen(o){custOpen=o;$('custBody').style.display=o?'block':'none';$('custToggle').setAttribute('aria-expanded',o);renderCust();}
$('custToggle').onclick=()=>setCustOpen(!custOpen);
function renderCust(){
  if(!custOpen){$('custCount').textContent=t('（共 {0} 位）',customers.length);$('custArrow').textContent='▼ '+t('展开');
    $('custList').innerHTML=customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone)}</option>`).join('');return;}
  const q=$('custQ').value.trim().toLowerCase(), qd=digits(q);
  const rows=customers.filter(c=>!q||c.name.toLowerCase().includes(q)||(qd&&digits(c.phone).includes(qd)))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const shown=rows;$('custArrow').textContent='▲ '+t('收起');$('custCount').textContent=t('（共 {0} 位）',customers.length)+(rows.length>shown.length?' '+t('只显示前 {0} 位，请用搜索框查找',shown.length):'');
  $('custRows').innerHTML=shown.length?shown.map(c=>{const cs=custStats(c),id=esc(c.id);
    return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)||'-'}</td><td>${cs.n}</td><td class="r">${money(cs.total)}</td><td>${esc(cs.last)||t('未到店')}</td><td>${esc(c.notes)}</td>
    <td style="white-space:nowrap"><button data-a="bk" data-id="${id}">${t('预约')}</button> <button data-a="hs" data-id="${id}">${t('记录')}</button> <button data-a="ce" data-id="${id}">${t('编辑')}</button> <button class="d" data-a="cd" data-id="${id}">${t('删除')}</button></td></tr>`}).join('')
    :'<tr><td colspan="7" class="empty">'+t('没有找到顾客。点“新增顾客”可先存入还没来过的顾客。')+'</td></tr>';
  $('custList').innerHTML=customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone)}</option>`).join('');
}
$('custQ').oninput=renderCust;
$('fName').addEventListener('change',()=>{const v=$('fName').value.trim().toLowerCase();
  const c=customers.find(x=>x.name.trim().toLowerCase()===v); if(c&&!$('fPhone').value)$('fPhone').value=c.phone;});
function openCuEdit(c){cuEditId=c?c.id:null;$('cuTitle').textContent=c?t('编辑顾客'):t('新增顾客');
  $('cuName').value=c?c.name:'';$('cuPhone').value=c?c.phone:'';$('cuNotes').value=c?c.notes:'';
  $('cuEdit').style.display='flex';setTimeout(()=>$('cuName').focus(),50);}
$('custAdd').onclick=()=>openCuEdit(null);
$('cuNo').onclick=()=>{$('cuEdit').style.display='none'};
$('cuOk').onclick=()=>{
  const name=$('cuName').value.trim(), phone=$('cuPhone').value.trim(), notes=$('cuNotes').value.trim();
  if(!name){alert(t('请填写顾客姓名'));return;}
  const dup=phone&&customers.find(x=>x.id!==cuEditId&&digits(x.phone)===digits(phone));
  if(dup){alert(t('这个电话已属于顾客「{0}」',dup.name));return;}
  if(cuEditId){const c=customers.find(x=>x.id===cuEditId);
    const changed=c.name!==name||c.phone!==phone;
    if(changed){records.forEach(r=>{if(matches(c,r)){r.customerName=name;r.phone=phone;}});save();}
    Object.assign(c,{name,phone,notes});
  }else customers.push(normCust({name,phone,notes}));
  saveCust();$('cuEdit').style.display='none';render();
};
$('custRows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const c=customers.find(x=>x.id===b.dataset.id);if(!c)return;const a=b.dataset.a;
  if(a==='bk'){resetForm();$('fName').value=c.name;$('fPhone').value=c.phone;$('formCard').scrollIntoView({behavior:'smooth'});$('fTime').focus();}
  else if(a==='ce')openCuEdit(c);
  else if(a==='cd'){if(confirm(t('从顾客资料中删除「{0}」？\n（已有的预约和消费记录不会被删除）',c.name))){customers=customers.filter(x=>x!==c);saveCust();render();}}
  else if(a==='hs'){const l=records.filter(r=>matches(c,r)).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time)),cs=custStats(c);
    const st={booked:t('预约中'),done:t('已完成'),cancelled:t('已取消')};
    $('hsTitle').textContent=c.name+(c.phone?'　'+c.phone:'');
    $('hsSum').textContent=t('到店 {0} 次，消费总额 RM {1}',cs.n,money(cs.total))+(c.notes?'　'+t('备注：{0}',c.notes):'');
    $('hsRows').innerHTML=l.length?l.map(r=>`<tr><td>${esc(r.date)} ${esc(r.time)}</td><td>${esc(itemsText(r))}</td><td>${st[r.status]||''}</td><td class="r">${r.status==='done'?money(r.amount):'-'}</td><td>${esc(r.receiptNo||'-')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">'+t('还没有来过。')+'</td></tr>';
    $('cuHist').style.display='flex';}
});
const pkey=p=>{let d=digits(p);if(d.startsWith('60'))d=d.slice(2);return d.replace(/^0+/,'');};
function parseCSV(t){const first=t.split('\n')[0]||'';
  const d=[',',';','\t'].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function parseVCF(t){return t.split(/BEGIN:VCARD/i).slice(1).map(b=>{const g=re=>{const m=b.match(re);return m?m[1].trim():''};
  let name=g(/^FN[^:\n]*:(.*)$/m);if(!name)name=g(/^N[^:\n]*:(.*)$/m).split(';').filter(Boolean).reverse().join(' ');
  return {name,phone:g(/^TEL[^:\n]*:(.*)$/m),notes:g(/^NOTE[^:\n]*:(.*)$/m)};});}
const toISO=x=>{x=String(x||'');let m=x.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);m=x.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+pad(m[2])+'-'+pad(m[1]):'';};
const normPhone=x=>{x=String(x||'').trim();const d=x.replace(/\D/g,'');return(/^60\d{8,10}$/.test(d)&&!x.startsWith('+'))?'0'+d.slice(2):x;};
function rowsToCust(rows){
  const hi=rows.findIndex(r=>r.length>1&&r.some(c=>/name|姓名|名字|顾客|客户|客人|会员|phone|mobile|tel|电话|手机/i.test(c)));
  const head=hi>=0,h=head?rows[hi].map(x=>x.trim().toLowerCase()):[],f=re=>h.findIndex(x=>re.test(x));
  const ni=f(/name|姓名|名字|顾客|客户|客人|会员/),pi=f(/phone|mobile|tel|电话|手机|号码|contact/),bi=f(/note|remark|备注|memo/),li=f(/last.?visit|最近|上次/);
  const N=head&&ni>=0?ni:0,P=head?pi:1,B=head?bi:2;
  return rows.slice(head?hi+1:0).map(r=>({name:(r[N]||'').trim(),phone:P>=0?normPhone(r[P]):'',notes:B>=0?(r[B]||'').trim():'',lastVisit:li>=0?toISO(r[li]):''}));}
$('custImport').onclick=()=>$('custFile').click();
$('custFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const txt=String(rd.result).replace(/^\uFEFF/,'');
    if(txt.includes('\uFFFD')&&!confirm(t('文件里有无法识别的字符，可能不是 UTF-8 编码，姓名可能出现乱码。仍要继续吗？')))return;
    const list=(/BEGIN:VCARD/i.test(txt)?parseVCF(txt):rowsToCust(parseCSV(txt))).filter(x=>x.name);
    if(!list.length){alert(t('没有读到顾客。请确认文件第一行是标题（如：姓名、电话）。'));return;}
    const add=[];let skip=0;
    list.forEach(x=>{const k=pkey(x.phone);
      const dup=[...customers,...add].some(c=>(k&&pkey(c.phone))?pkey(c.phone)===k:c.name.trim().toLowerCase()===x.name.toLowerCase());
      if(dup)skip++;else add.push(normCust(x));});
    if(!confirm(t('读取到 {0} 位顾客：新增 {1} 位，{2} 位已存在将跳过。确定导入？',list.length,add.length,skip)))return;
    customers=customers.concat(add);saveCust();render();alert(t('已导入 {0} 位顾客。',add.length));
  }catch(err){alert(t('导入失败：无法读取这个文件。'));}};
  rd.readAsText(f);e.target.value='';};
$('hsClose').onclick=()=>{$('cuHist').style.display='none'};

/* ---------- 备份 / 恢复 ---------- */
function dlFile(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$('exportBtn').onclick=async()=>{
  const name='hair_salon_backup_'+today()+'.json', text=backupText();
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
    else dlFile(name,text);
    localStorage.setItem(LB,new Date().toISOString());
  }catch(e){if(e&&e.name==='AbortError')return; dlFile(name,text); localStorage.setItem(LB,new Date().toISOString());}
  renderSafety();
};
function backupText(){return JSON.stringify({version:2,exportedAt:new Date().toISOString(),records,customers,services:svcList,products:prodList,shop:getShop()},null,2);}
function importText(text){
  try{
    const j=JSON.parse(text.trim()); const arr=Array.isArray(j)?j:(j&&j.records);
    if(!Array.isArray(arr))throw new Error('bad');
    const inc=arr.map(normalize);
    if(!confirm(t('导入 {0} 条记录。\n\n确定 = 与现有数据合并（相同 id 以导入为准，不会删除现有记录）\n取消 = 放弃导入',inc.length)))return false;
    const map=new Map(records.map(r=>[r.id,r])); inc.forEach(r=>map.set(r.id,r));
    records=[...map.values()]; save();
    if(!Array.isArray(j)&&Array.isArray(j.customers)){const cm=new Map(customers.map(c=>[c.id,c]));j.customers.map(normCust).forEach(c=>cm.set(c.id,c));customers=[...cm.values()];}
    if(!Array.isArray(j)&&j.shop&&typeof j.shop==='object'){const sh=j.shop;
      if(sh.name){$('shopName').value=sh.name;localStorage.setItem(SK,sh.name);}
      if(sh.address){$('shopAddr').value=sh.address;localStorage.setItem(SKA,sh.address);}
      if(sh.phone){$('shopPhone').value=sh.phone;localStorage.setItem(SKP,sh.phone);}}
    if(!Array.isArray(j)&&Array.isArray(j.services)){j.services.forEach(x=>{if(x&&typeof x.name==='string'&&x.name.trim()){const n=x.name.trim(),e=svcList.find(q=>q.name===n);if(e)e.price=num(x.price);else svcList.push({name:n,price:num(x.price)});}});saveSvc();renderChips();}
    if(!Array.isArray(j)&&Array.isArray(j.products)){j.products.forEach(x=>{if(x&&typeof x.name==='string'&&x.name.trim()){const n=x.name.trim(),e=prodList.find(q=>q.name===n),o={name:n,price:num(x.price),stock:Math.max(0,Math.floor(Number(x.stock))||0)};if(e)Object.assign(e,o);else prodList.push(o);}});saveProd();renderChips();}
    records.forEach(r=>ensureCust(r.customerName,r.phone)); saveCust(); render(); alert(t('导入完成，现有 {0} 条记录。',records.length));
    return true;
  }catch(err){alert(t('导入失败：文件不是有效的备份 JSON。现有数据未改动。'));return false;}
}
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader(); rd.onload=()=>importText(String(rd.result)); rd.readAsText(f); e.target.value='';
};
$('copyBtn').onclick=async()=>{
  const txt=backupText();
  try{await navigator.clipboard.writeText(txt);localStorage.setItem(LB,new Date().toISOString());renderSafety();alert(t('备份文本已复制。请粘贴到“备忘录”、WhatsApp 或邮件里保存。'));}
  catch(e){$('pasteTxt').value=txt;$('pasteBox').style.display='flex';$('pasteTxt').select();alert(t('无法自动复制。请手动全选下面的文字并复制。'));}
};
$('pasteBtn').onclick=()=>{$('pasteTxt').value='';$('pasteBox').style.display='flex';setTimeout(()=>$('pasteTxt').focus(),50);};
$('pasteNo').onclick=()=>{$('pasteBox').style.display='none'};
$('pasteOk').onclick=()=>{if(importText($('pasteTxt').value))$('pasteBox').style.display='none';};

  if(showAll){showAll=false;render();}
  document.body.classList.remove('pr-receipt'); $('pDate').textContent=today(); window.print();
};

loadCustomers();
try{customSvc=JSON.parse(localStorage.getItem('hair_salon_custom_svc_v1')||'[]').filter(x=>typeof x==='string')}catch(e){customSvc=[]}
loadSvc();loadProd();
month=today().slice(0,7); $('monthSel').value=month;
$('shopName').value=localStorage.getItem(SK)||'我的理发店'; $('shopAddr').value=localStorage.getItem(SKA)||''; $('shopPhone').value=localStorage.getItem(SKP)||'';
resetForm();
showLock(localStorage.getItem(PK)?'login':'setup');
$('langSel').onchange=$('langSel2').onchange=e=>setLang(e.target.value);
setLang(lang);
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#1f4e5f';x.fillRect(0,0,180,180);
  x.fillStyle='#fff';x.font='110px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✂',90,96);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}
})();
</script>
